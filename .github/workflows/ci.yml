name: CI

# 门禁的动机：本仓库的「新增 provider 10 项清单」和脱敏规则此前只靠人工执行，
# 本地 `.git/hooks/pre-push` 又可以被 `--no-verify` 绕过、新克隆也不会自动安装。
# 这里把门槛交给机器：类型 + 全量单测 + 脱敏校验三者任一失败即拦截。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # ⚠️ 仓库 `.npmrc` 里的 `script-shell=C:\Windows\System32\cmd.exe` 是作者本机
    # （Windows）的配置。在 Linux runner 上这个路径不存在，pnpm 每次要跑脚本时
    # （包括 `pnpm install` 触发的 `prepare` → `build:all`）都会 spawn ENOENT 直接失败。
    # 环境变量优先级高于项目级 .npmrc，这里把它覆盖回 Unix 默认 shell，
    # 否则本工作流在第一步 Install 就会红，门禁形同虚设。
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `prepare` 脚本会跑 build:all（宿主 tsc + 资源拷贝 + 客户端 esbuild），
      # 因此这一步同时验证了构建链本身。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 先跑 lint：零依赖、秒级，能在 typecheck/test 之前拦住
      # 「测试里留了 .only」「构造期捕获 fetch」「面板/能力表/设置三方不同步」。
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 2600+ 用例全部为纯 mock，无网络依赖，约 1 分钟。
      - name: Unit tests
        run: pnpm test

      # 与本地 pre-push 同一份实现：命中未脱敏数据即退出码 1。
      - name: Secret sanitization gate
        run: pnpm check:secrets
